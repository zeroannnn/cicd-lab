name: Run Tests

on:
    push:
        branches:
            - "**"
    pull_request:

permissions:
    id-token: write
    contents: read
    statuses: write
    checks: write
    pull-requests: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: "22"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: |
                  mkdir -p reports
                  npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
            
            - name: Render Test Report to GitHub PR
              uses: dorny/test-reporter@v1
              if: always() # 確保測試失敗時也能把精美的錯誤圖表畫出來
              with:
                  name: Vitest Test Results
                  path: reports/vitest-junit.xml 
                  reporter: jest-junit

            - name: Upload test report artifact
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-report
                  path: reports/
                  if-no-files-found: error
